<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--
        The head is the SEO surface and belongs here, statically: the body is
        prerendered into #root at build time, so both a crawler and an assistant
        read the whole page without executing JavaScript.
    -->
    <title>InspirAI — AI-Powered Design Research for Coding Agents</title>
    <meta name="description" content="refero-design-mcp is an MCP server for discovering, searching and extracting design systems from the public pages of styles.refero.design.">
    <link rel="canonical" href="https://inspirai.os.darcas.app/">
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <!-- Open Graph. `og:image` arrives with the poster in Step 6. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="InspirAI">
    <meta property="og:title" content="InspirAI — AI-Powered Design Research for Coding Agents">
    <meta property="og:description" content="refero-design-mcp is an MCP server for discovering, searching and extracting design systems from the public pages of styles.refero.design.">
    <meta property="og:url" content="https://inspirai.os.darcas.app/">

    <!-- Twitter. The card becomes `summary_large_image` with the poster in Step 6. -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="InspirAI — AI-Powered Design Research for Coding Agents">
    <meta name="twitter:description" content="refero-design-mcp is an MCP server for discovering, searching and extracting design systems from the public pages of styles.refero.design.">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
