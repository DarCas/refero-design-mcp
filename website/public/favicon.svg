<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="InspirAI">
    <style>
        /* A tab bar can be dark, which would swallow the graphite plate. The
         * plate follows the theme; the mark keeps the Kagi violet, which reads
         * on both. Unsupported renderers simply ignore the stylesheet. */
        @media (prefers-color-scheme: dark) {
            .plate {
                fill: #fafafa;
            }
        }
    </style>
    <rect class="plate" width="32" height="32" rx="7" fill="#18181a"/>
    <path class="mark" d="M9 11h14M9 16h14M9 21h9" stroke="#6c5edc" stroke-width="2.5"
        stroke-linecap="round"/>
</svg>
